[build-system]
requires = ["maturin>=1.11,<2"]
build-backend = "maturin"

[project]
name = "genomic-attribute-index"
version = "0.1.1"
description = "Python bindings for the deterministic Genomic Attribute Index"
readme = "PYPI-README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "GAI contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[tool.maturin]
manifest-path = "Cargo.toml"
python-source = "src"
module-name = "gai._gai"
features = ["abi3", "extension-module"]
compatibility = "pypi"
data = "gai.data"
include = [{ path = "gai.data/scripts/.gitkeep", format = "sdist" }]
exclude = [{ path = "gai.data/scripts/.gitkeep", format = "wheel" }]
