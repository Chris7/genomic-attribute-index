name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'python/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-26
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets --all-features
      - name: Documentation
        run: cargo doc --locked --all-features --no-deps
      - name: Release build
        run: cargo build --locked --release --all-features
      - name: Cargo package
        run: cargo package --locked --allow-dirty

  python-build:
    name: Build Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-26
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            python/target
          key: ${{ runner.os }}-python-build-${{ hashFiles('Cargo.lock', 'python/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-build-

      - name: Build gai binary
        run: cargo build --release --locked --bin gai

      - name: Stage gai binary for Python wheel
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          executable = "gai.exe" if os.name == "nt" else "gai"

          source = Path("target/release") / executable
          destination = Path("python/gai.data/scripts") / executable

          if not source.is_file():
              raise SystemExit(f"missing gai binary: {source}")

          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, destination)

          print(f"staged {source} -> {destination}")

      - uses: PyO3/maturin-action@86b9d133d34bc1b40018696f782949dac11bd380
        with:
          command: build
          maturin-version: v1.11.5
          args: --manifest-path python/Cargo.toml --release --locked --features abi3,extension-module --compatibility pypi --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl

  python:
    name: Python ${{ matrix.python-version }}
    needs: python-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-06-26
      - uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: dist
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            python/target
          key: ${{ runner.os }}-python-${{ matrix.python-version }}-${{ hashFiles('Cargo.lock', 'python/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ matrix.python-version }}-
      - name: Install wheel and test
        run: |
          python -m pip install --disable-pip-version-check pytest dist/*.whl
          pytest -q python/tests
