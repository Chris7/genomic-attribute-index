[package]
name = "genomic-attribute-index"
version = "0.1.3"
edition = "2024"
description = "Deterministic Genomic Attribute Index (GAI) builder and indexed query library"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/Chris7/genomic-attribute-index"
keywords = ["gff", "bioinformatics", "genomics", "index"]
categories = ["science", "command-line-utilities"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "src/**",
    "examples/**",
    "benches/**",
    "docs/**",
    "tests/**",
    "LICENSE*",
]

[lib]
name = "gai"
path = "src/lib.rs"

[[bin]]
name = "gai"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ext-sort = { version = "^0.1.5" }
crc32fast = "1.4"
fst = "0.4"
memmap2 = "0.9"
noodles = { version = "0.101", features = ["bgzf", "core", "csi", "gff", "tabix"] }
rayon = "1.11"
regex = "1.12"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2.0"
zstd = "0.13"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
natord = "1.0.9"

[dev-dependencies]
tempfile = "3.20"

[[bench]]
name = "compression"
harness = false
test = false

[[bench]]
name = "build-performance"
harness = false
test = false

[[bench]]
name = "query-performance"
harness = false
test = false

[profile.release]
opt-level = 3
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.crc32fast]
opt-level = 3
